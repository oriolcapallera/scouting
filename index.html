<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scouting de recepció</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8E0B20">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scouting">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EFEF; --surface:#FFFFFF; --surface-2:#F8F5F5; --ink:#241A1C; --muted:#6E5F62;
  --court:#8E0B20; --court-ink:#FFFFFF; --floor:#D21F35; --floor-ink:#FFFFFF;
  --line:#E3D8D9; --danger:#5A0A16; --video:#140A0C;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1214; --surface:#261A1D; --surface-2:#2F2124; --ink:#F5ECEC; --muted:#B9A7AA;
    --court:#A8142B; --court-ink:#FFFFFF; --floor:#E5304A; --floor-ink:#FFFFFF;
    --line:#3F2C30; --danger:#6B0D1C; --video:#0C0607;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1214; --surface:#261A1D; --surface-2:#2F2124; --ink:#F5ECEC; --muted:#B9A7AA;
  --court:#A8142B; --court-ink:#FFFFFF; --floor:#E5304A; --floor-ink:#FFFFFF;
  --line:#3F2C30; --danger:#6B0D1C; --video:#0C0607;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  -webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--floor);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}

/* Top bar */
.top{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--surface);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--cond);font-weight:700;font-size:1.25rem;letter-spacing:.01em;margin-right:4px;color:var(--court)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand{color:var(--floor)}}
.url{flex:1 1 220px;min-width:0;display:flex;gap:6px}
.url input{flex:1;min-width:0;height:40px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink);padding:0 12px;font:inherit;font-size:.95rem}
.btn{height:40px;padding:0 14px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);
  font-weight:600;font-size:.95rem;white-space:nowrap}
.btn.primary{background:var(--court);color:var(--court-ink);border-color:var(--court)}
.btn.danger-armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.setctl{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:40px}
.setctl button{width:36px;height:100%;font-size:1.2rem;background:var(--surface-2)}
.setctl span{padding:0 10px;font-family:var(--cond);font-weight:600;font-size:1.1rem;min-width:62px;text-align:center}

/* Main */
.main{position:relative;min-height:0;background:var(--video)}
.main iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#C9D4E3}
.empty p{max-width:34ch;margin:0;line-height:1.5}
.live{position:absolute;inset:0;overflow:auto;background:var(--bg);padding:16px;display:none}
.app.novideo .live{display:block}
.app.novideo iframe,.app.novideo .empty{display:none}
.live h2{font-family:var(--cond);font-weight:600;font-size:1.5rem;margin:0 0 12px}

/* Bottom bar */
.bar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:stretch;padding:10px;
  background:var(--surface);border-top:1px solid var(--line)}
.rot{display:flex;align-items:stretch;border-radius:12px;overflow:hidden;background:var(--court);color:var(--court-ink)}
.rot button{min-width:44px;font-size:1.4rem}
.rot .cur{font-family:var(--cond);font-weight:700;font-size:2rem;min-width:84px;padding:0 6px;
  border-left:1px solid rgba(255,255,255,.2);border-right:1px solid rgba(255,255,255,.2)}
.zones{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.z{min-height:72px;border-radius:12px;background:var(--floor);color:var(--floor-ink);
  font-family:var(--cond);font-weight:700;font-size:2.1rem;transition:transform .08s}
.z:active{transform:scale(.95)}
.z.hit{animation:hit .35s}
@keyframes hit{0%{box-shadow:0 0 0 0 var(--floor)}100%{box-shadow:0 0 0 10px transparent}}
.side{display:flex;gap:8px}
.side .btn{height:auto;min-height:72px;border-radius:12px;padding:0 14px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:2px}
.side .count{font-family:var(--cond);font-size:1.4rem;font-weight:700;line-height:1}
.side small{font-size:.8rem;color:var(--muted);font-weight:500}
.side .primary small{color:var(--court-ink);opacity:.85}
.app.novideo .z{min-height:110px;font-size:2.8rem}
.app.novideo .side .btn{min-height:110px}

@media (max-width:760px){
  .bar{grid-template-columns:1fr auto;grid-template-areas:"zones zones" "rot side"}
  .zones{grid-area:zones}.rot{grid-area:rot}.side{grid-area:side}
  .z{min-height:64px;font-size:1.8rem}.side .btn{min-height:56px}
}

/* Rotation picker */
.pop{position:fixed;inset:0;background:rgba(5,12,22,.55);display:none;align-items:flex-end;justify-content:flex-start;
  padding:12px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));z-index:20}
.pop.open{display:flex}
.pop .card{background:var(--surface);border-radius:14px;padding:12px;display:grid;grid-template-columns:repeat(3,96px);gap:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.3)}
.pop .card button{height:72px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);
  font-family:var(--cond);font-weight:700;font-size:1.8rem}
.pop .card button.on{background:var(--court);color:var(--court-ink);border-color:var(--court)}

/* Stats sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{display:flex}
.sheet header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet header h2{font-family:var(--cond);font-weight:700;font-size:1.6rem;margin:0;flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{height:40px;padding:0 12px;background:var(--surface-2);font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--court);color:var(--court-ink)}
.sheet .body{flex:1;overflow:auto;padding:16px;display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:20px;align-content:start}
@media (max-width:820px){.sheet .body{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h3{font-family:var(--cond);font-weight:600;font-size:1.25rem;margin:0 0 10px}

/* Court */
.court{position:relative;border:3px solid var(--court);border-radius:4px;background:var(--surface-2);
  aspect-ratio:1/1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;max-width:420px}
.court::before{content:"";position:absolute;left:-6px;right:-6px;top:-9px;height:6px;background:var(--court);border-radius:3px}
.court::after{content:"";position:absolute;left:0;right:0;top:33.3%;border-top:2px dashed var(--court);opacity:.6}
.court .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid var(--line);position:relative}
.court .cell:nth-child(-n+3){grid-row:1}
.court .cell .zn{position:absolute;top:6px;left:8px;font-size:.8rem;color:var(--muted);font-weight:600}
.court .cell .pct{font-family:var(--cond);font-weight:700;font-size:2rem;line-height:1}
.court .cell .n{font-size:.85rem;color:var(--muted)}
.court .cell.off{background:repeating-linear-gradient(45deg,transparent 0 8px,var(--line) 8px 9px)}
.court .cell.top{outline:3px solid var(--court);outline-offset:-3px}
.court-cap{font-size:.85rem;color:var(--muted);margin:8px 0 0}

/* Table */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{font-family:var(--cond);font-weight:600;font-size:1.05rem;color:var(--muted)}
td:first-child,th:first-child{text-align:left;font-family:var(--cond);font-weight:700;font-size:1.15rem;color:var(--ink)}
td .p{font-weight:600}
td .c{display:block;font-size:.75rem;color:var(--muted)}
td.max{background:color-mix(in srgb,var(--floor) 22%,transparent);box-shadow:inset 0 0 0 2px var(--floor);border-radius:6px}
tr.total td{font-weight:600;border-bottom:0}
tr.cur td:first-child{color:var(--court)}
.trend{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.trend li{display:flex;gap:12px;align-items:baseline;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.trend b{font-family:var(--cond);font-size:1.25rem;min-width:34px}
.trend span{color:var(--muted)}
.trend em{font-style:normal;font-weight:600;color:var(--ink)}

.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-10px);
  background:var(--court);color:var(--court-ink);padding:10px 18px;border-radius:999px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.z,.toast{transition:none}.z.hit{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <span class="brand">Scouting</span>
    <form class="url" id="urlForm" onsubmit="return false">
      <input id="urlInput" type="url" inputmode="url" placeholder="Enllaç del directe de YouTube" aria-label="Enllaç del directe de YouTube">
      <button class="btn primary" id="loadBtn" type="button">Obre</button>
    </form>
    <div class="setctl" aria-label="Set actual">
      <button id="setDown" aria-label="Set anterior">−</button>
      <span id="setLabel">Set 1</span>
      <button id="setUp" aria-label="Set següent">+</button>
    </div>
    <button class="btn" id="videoToggle">Amaga vídeo</button>
    <button class="btn primary" id="installBtn" hidden>Instal·la</button>
    <button class="btn" id="resetBtn">Esborra dades</button>
  </div>

  <div class="main">
    <iframe id="yt" title="Directe" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen hidden></iframe>
    <div class="empty" id="empty"><p>Enganxa a dalt l'enllaç del directe de YouTube per veure'l aquí. Pots tirar enrere amb la barra de temps del reproductor.</p></div>
    <div class="live" id="live">
      <h2 id="liveTitle">R1</h2>
      <div id="liveCourt"></div>
    </div>
  </div>

  <div class="bar">
    <div class="rot">
      <button id="rotPrev" aria-label="Rotació anterior">‹</button>
      <button class="cur" id="rotCur" aria-label="Tria rotació">R1</button>
      <button id="rotNext" aria-label="Rotació següent">›</button>
    </div>
    <div class="zones" id="zones"></div>
    <div class="side">
      <button class="btn" id="undoBtn"><span class="count">↶</span><small>Desfés</small></button>
      <button class="btn primary" id="statsBtn"><span class="count" id="countLbl">0</span><small>Tendències</small></button>
    </div>
  </div>
</div>

<div class="pop" id="pop"><div class="card" id="popCard"></div></div>

<div class="sheet" id="sheet" role="dialog" aria-label="Tendències de l'equip contrari">
  <header>
    <h2>Tendències en recepció</h2>
    <div class="seg" id="setFilter"></div>
    <button class="btn primary" id="closeSheet">Torna al partit</button>
  </header>
  <div class="body">
    <div class="panel">
      <h3>Camp per rotació</h3>
      <div class="seg" id="rotFilter" style="margin-bottom:14px;flex-wrap:wrap"></div>
      <div id="sheetCourt"></div>
    </div>
    <div style="display:grid;gap:20px;align-content:start">
      <div class="panel">
        <h3>Zona d'atac per rotació</h3>
        <div class="tablewrap" id="table"></div>
      </div>
      <div class="panel">
        <h3>Resum ràpid</h3>
        <ul class="trend" id="trend"></ul>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var KEY='scout-recepcio-v1';
  var ZONES=['Z1','Z2','Z3','Z4','Z6'];
  var state={events:[],rot:1,set:1,url:'',video:true};
  var view={set:0,rot:0}; // filtres de la pantalla de tendències (0 = tot)
  var $=function(id){return document.getElementById(id)};

  function load(){
    try{
      var s=JSON.parse(localStorage.getItem(KEY));
      if(s&&Array.isArray(s.events)){state=Object.assign(state,s);}
    }catch(e){}
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

  // ---------- Vídeo ----------
  function ytId(u){
    u=(u||'').trim();
    if(/^[\w-]{11}$/.test(u))return u;
    try{
      var x=new URL(u);
      if(x.hostname.indexOf('youtu.be')>-1)return x.pathname.slice(1,12);
      if(x.searchParams.get('v'))return x.searchParams.get('v');
      var m=x.pathname.match(/\/(live|embed|shorts)\/([\w-]{11})/);
      if(m)return m[2];
    }catch(e){}
    return null;
  }
  function loadVideo(url){
    var id=ytId(url);
    if(!id){toast("No reconec l'enllaç. Copia'l de YouTube amb Compartir.");return;}
    state.url=url;save();
    var f=$('yt');
    var o='';try{if(location.origin&&location.origin!=='null')o='&origin='+encodeURIComponent(location.origin);}catch(e){}
    f.referrerPolicy='strict-origin-when-cross-origin';
    f.src='https://www.youtube.com/embed/'+id+'?autoplay=1&playsinline=1&rel=0&enablejsapi=0'+o;
    f.hidden=false;$('empty').hidden=true;
  }
  $('loadBtn').onclick=function(){loadVideo($('urlInput').value);};
  $('urlInput').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();loadVideo(this.value);}});

  $('videoToggle').onclick=function(){state.video=!state.video;save();applyVideo();};
  function applyVideo(){
    $('app').classList.toggle('novideo',!state.video);
    $('videoToggle').textContent=state.video?'Amaga vídeo':'Mostra vídeo';
    renderLive();
  }

  // ---------- Set ----------
  function renderSet(){$('setLabel').textContent='Set '+state.set;}
  $('setDown').onclick=function(){if(state.set>1){state.set--;save();renderSet();}};
  $('setUp').onclick=function(){if(state.set<5){state.set++;save();renderSet();}};

  // ---------- Rotació ----------
  function setRot(r){state.rot=((r-1+6)%6)+1;save();renderRot();renderLive();}
  function renderRot(){$('rotCur').textContent='R'+state.rot;}
  $('rotPrev').onclick=function(){setRot(state.rot-1);};
  $('rotNext').onclick=function(){setRot(state.rot+1);};
  $('rotCur').onclick=function(){
    var c=$('popCard');c.innerHTML='';
    for(var r=1;r<=6;r++){
      (function(r){
        var b=document.createElement('button');
        b.textContent='R'+r;if(r===state.rot)b.className='on';
        b.onclick=function(){setRot(r);closePop();};
        c.appendChild(b);
      })(r);
    }
    $('pop').classList.add('open');
  };
  function closePop(){$('pop').classList.remove('open');}
  $('pop').onclick=function(e){if(e.target===this)closePop();};

  // ---------- Registre ----------
  var zc=$('zones');
  ZONES.forEach(function(z){
    var b=document.createElement('button');
    b.className='z';b.textContent=z;b.setAttribute('aria-label','Registra atac per '+z);
    b.onclick=function(){
      state.events.push({r:state.rot,z:z,s:state.set,t:Date.now()});
      save();
      b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');
      try{navigator.vibrate&&navigator.vibrate(15);}catch(e){}
      toast(z+' a R'+state.rot);
      renderCount();renderLive();
    };
    zc.appendChild(b);
  });
  $('undoBtn').onclick=function(){
    var ev=state.events.pop();
    if(!ev){toast('No hi ha res per desfer');return;}
    save();toast('Desfet: '+ev.z+' a R'+ev.r);renderCount();renderLive();
  };
  function renderCount(){$('countLbl').textContent=state.events.length;}

  var armTimer=null;
  $('resetBtn').onclick=function(){
    var b=this;
    if(b.classList.contains('danger-armed')){
      clearTimeout(armTimer);
      state.events=[];state.set=1;state.rot=1;save();
      b.classList.remove('danger-armed');b.textContent='Esborra dades';
      renderAll();toast('Dades esborrades');
      return;
    }
    b.classList.add('danger-armed');b.textContent='Toca per confirmar';
    armTimer=setTimeout(function(){b.classList.remove('danger-armed');b.textContent='Esborra dades';},3000);
  };

  // ---------- Càlculs ----------
  function filtered(set,rot){
    return state.events.filter(function(e){return (!set||e.s===set)&&(!rot||e.r===rot);});
  }
  function countZones(list){
    var c={Z1:0,Z2:0,Z3:0,Z4:0,Z6:0};
    list.forEach(function(e){if(c[e.z]!==undefined)c[e.z]++;});
    return c;
  }
  function pct(n,t){return t?Math.round(n*100/t):0;}

  // Camp: fila davantera 4 3 2, fila del darrere 5 6 1 (xarxa a dalt)
  function courtHTML(set,rot){
    var list=filtered(set,rot),t=list.length,c=countZones(list);
    var max=0;ZONES.forEach(function(z){if(c[z]>max)max=c[z];});
    var order=['Z4','Z3','Z2','Z5','Z6','Z1'];
    var h='<div class="court">';
    order.forEach(function(z){
      if(z==='Z5'){h+='<div class="cell off"><span class="zn">Z5</span></div>';return;}
      var p=pct(c[z],t);
      var mix=t?Math.round(8+p*0.55):0;
      var bg=t?'background:color-mix(in srgb,var(--floor) '+mix+'%,var(--surface-2))':'';
      var top=(t&&c[z]===max&&max>0)?' top':'';
      h+='<div class="cell'+top+'" style="'+bg+'"><span class="zn">'+z+'</span>'+
         '<span class="pct">'+(t?p+'%':'–')+'</span><span class="n">'+c[z]+' atac'+(c[z]===1?'':'s')+'</span></div>';
    });
    h+='</div><p class="court-cap">'+(t?t+' sortides registrades'+(rot?' a R'+rot:'')+(set?' al set '+set:''):'Encara no hi ha sortides registrades'+(rot?' a R'+rot:''))+'. Xarxa a dalt.</p>';
    return h;
  }

  function renderLive(){
    if(state.video)return;
    $('liveTitle').textContent='Tendència actual a R'+state.rot;
    $('liveCourt').innerHTML=courtHTML(0,state.rot);
  }

  // ---------- Pantalla de tendències ----------
  function segButtons(el,items,cur,onPick){
    el.innerHTML='';
    items.forEach(function(it){
      var b=document.createElement('button');
      b.textContent=it.label;if(it.v===cur)b.className='on';
      b.onclick=function(){onPick(it.v);};
      el.appendChild(b);
    });
  }
  function renderSheet(){
    var sets=[{v:0,label:'Tot'}];
    var maxSet=Math.max(state.set,1);
    state.events.forEach(function(e){if(e.s>maxSet)maxSet=e.s;});
    for(var s=1;s<=maxSet;s++)sets.push({v:s,label:'Set '+s});
    segButtons($('setFilter'),sets,view.set,function(v){view.set=v;renderSheet();});
    var rots=[{v:0,label:'Totes'}];
    for(var r=1;r<=6;r++)rots.push({v:r,label:'R'+r});
    segButtons($('rotFilter'),rots,view.rot,function(v){view.rot=v;renderSheet();});
    $('sheetCourt').innerHTML=courtHTML(view.set,view.rot);

    // Taula
    var h='<table><thead><tr><th>Rot.</th>';
    ZONES.forEach(function(z){h+='<th>'+z+'</th>';});
    h+='<th>Total</th></tr></thead><tbody>';
    var trend='';
    for(r=1;r<=6;r++){
      var list=filtered(view.set,r),t=list.length,c=countZones(list),max=0;
      ZONES.forEach(function(z){if(c[z]>max)max=c[z];});
      h+='<tr'+(r===state.rot?' class="cur"':'')+'><td>R'+r+'</td>';
      ZONES.forEach(function(z){
        var cls=(t&&c[z]===max&&max>0)?' class="max"':'';
        h+='<td'+cls+'><span class="p">'+(t?pct(c[z],t)+'%':'–')+'</span><span class="c">'+c[z]+'</span></td>';
      });
      h+='<td>'+t+'</td></tr>';

      var sorted=ZONES.slice().sort(function(a,b){return c[b]-c[a];}).filter(function(z){return c[z]>0;});
      var txt;
      if(!t)txt='<span>Sense dades</span>';
      else{
        txt='<span><em>'+sorted[0]+' '+pct(c[sorted[0]],t)+'%</em>';
        if(sorted[1])txt+=', després '+sorted[1]+' '+pct(c[sorted[1]],t)+'%';
        txt+=' ('+t+' sortide'+(t===1?'':'s')+(t<4?', poques dades':'')+')</span>';
      }
      trend+='<li><b>R'+r+'</b>'+txt+'</li>';
    }
    var all=filtered(view.set,0),ta=all.length,ca=countZones(all);
    h+='<tr class="total"><td>Total</td>';
    ZONES.forEach(function(z){h+='<td><span class="p">'+(ta?pct(ca[z],ta)+'%':'–')+'</span><span class="c">'+ca[z]+'</span></td>';});
    h+='<td>'+ta+'</td></tr></tbody></table>';
    $('table').innerHTML=h;
    $('trend').innerHTML=trend;
  }
  $('statsBtn').onclick=function(){view.rot=state.rot;view.set=0;renderSheet();$('sheet').classList.add('open');};
  $('closeSheet').onclick=function(){$('sheet').classList.remove('open');};
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){$('sheet').classList.remove('open');closePop();}
  });

  // ---------- Avisos ----------
  var tt=null;
  function toast(msg){
    var t=$('toast');t.textContent=msg;t.classList.add('show');
    clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show');},1100);
  }

  function renderAll(){renderSet();renderRot();renderCount();applyVideo();}
  // ---------- Instal·lació com a app ----------
  var deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;$('installBtn').hidden=false;});
  $('installBtn').onclick=function(){
    if(!deferred)return;
    deferred.prompt();
    deferred.userChoice.finally(function(){deferred=null;$('installBtn').hidden=true;});
  };
  window.addEventListener('appinstalled',function(){$('installBtn').hidden=true;toast('App instal·lada');});
  if('serviceWorker' in navigator && location.protocol==='https:'){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
  }

  load();
  if(state.url){$('urlInput').value=state.url;loadVideo(state.url);}
  renderAll();
})();
</script>
</body>
</html>
